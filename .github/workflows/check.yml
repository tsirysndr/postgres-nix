name: Nix build and checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Compile and test PureScript CI component
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PureScript through FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
          module: setup-purescript@v0.2.0
          args: setup --version 0.15.16 --spago-version 1.0.5 --node-version 24.22.2 --bun-version 1.4.3 --install-dir "${{ github.workspace }}/.fluentci/ci"
      - name: Compile, test and stage the portable component
        run: fluentci --check-update=false run --frozen-lockfile ci prepare
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-nix-ci
          path: .fluentci/ci/dist/ci.wasm
          if-no-files-found: error
          retention-days: 1

  check:
    name: Build and test (${{ matrix.system }})
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - uses: actions/download-artifact@v4
        with:
          name: postgres-nix-ci
          path: .fluentci/ci/dist
      - name: Set up Nix, build, check and report binaries
        run: fluentci --check-update=false run --wasm .fluentci/ci/dist/ci.wasm check --system "${{ matrix.system }}"
