# Baseline for a small production server; size memory/connections for the host.
# Paths and listen_addresses are supplied by the portable launcher.
max_connections = 100
superuser_reserved_connections = 3
shared_buffers = '256MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
password_encryption = 'scram-sha-256'
unix_socket_permissions = 0700

# Durability: never disable these to improve benchmark results.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
max_wal_size = '2GB'
min_wal_size = '256MB'
checkpoint_completion_target = 0.9
wal_compression = on
archive_mode = off

autovacuum = on
autovacuum_max_workers = 3
log_autovacuum_min_duration = '5s'
idle_in_transaction_session_timeout = '60s'

# The supervisor captures stderr; never log statement bodies or bind values.
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d %r '
log_connections = on
log_disconnections = on
log_checkpoints = on
log_lock_waits = on
log_statement = 'none'
log_min_error_statement = panic
log_parameter_max_length_on_error = 0
log_temp_files = '64MB'
timezone = 'UTC'
log_timezone = 'UTC'

# Runtime settings stay outside the Nix store. Reload or restart as required.
include_if_exists = 'local.conf'
