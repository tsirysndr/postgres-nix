# Only the OS account owning the private socket may administer the cluster.
# init writes an explicit OS-account -> postgres mapping to pg_ident.conf.
local   all   postgres                         peer map=owner
local   all   all                              reject

# No TCP superuser or replication login, even on loopback.
host    all   postgres   0.0.0.0/0              reject
host    all   postgres   ::/0                   reject
host    replication all 0.0.0.0/0              reject
host    replication all ::/0                   reject
host    app   app,app_migrator 127.0.0.1/32      scram-sha-256
host    app   app,app_migrator ::1/128           scram-sha-256
# No matching record means deny. Remote access requires explicit hostssl rules.
